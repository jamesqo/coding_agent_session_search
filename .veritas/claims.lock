{"kind":"veritas-claims-lock","schema":1}
{"claim_id":"cli/bare-invocation-prints-help","hash":"7d6d9a6a3edcdb46efda930f8568d133838686a3fda13d097bf19e8744873c71","representations":[{"adapter":"markdown","hash":"7154813b503b4630efd5783fe7db21b90db7eec53695e2c4b9e74891236da49d","role":"normative","scope":"block","text":"- **WHEN** `cass` is invoked without a command\n- **THEN** it prints concise help without launching an interactive interface"}]}
{"claim_id":"cli/operational-command-surface","hash":"b780fe1f3870958eb3433d1f4e128bdd99a87024ea60ec731247d9a4a08fe07b","representations":[{"adapter":"markdown","hash":"e89e1b809ba065f696ea3b771ed6878fa91362df98d958e6de9af1666250cffc","role":"normative","scope":"block","text":"The system SHALL expose only `index`, `search`, `view`, `status`, `forget`, and\n`models install` as operational commands. Operational output SHALL be JSON."}]}
{"claim_id":"cli/removed-commands-are-rejected","hash":"28502e5b8f09e91138bb0aacb8a7b534c0efcc0e38bb26832d30d653e103710b","representations":[{"adapter":"markdown","hash":"651347302a5974f974a69d6c756d1262fcdda6945c65d9f59ad01af5294fa8e3","role":"normative","scope":"block","text":"- **WHEN** a removed command such as `export`, `doctor`, `list`, or `sources` is invoked\n- **THEN** argument parsing fails without compatibility rewriting"}]}
{"claim_id":"configuration/cli-values-have-precedence","hash":"6ced7093f2e2230976df09ebcb5e200750dc7fd8481fbdd9ad458a130e72c368","representations":[{"adapter":"markdown","hash":"6416f5d4dbac4c02b4069e58e8392e5f9a942f9f1d17d022cb8177fe5fe532d4","role":"normative","scope":"block","text":"For configurable behavior, explicit CLI values SHALL replace corresponding\nvalues from the resolved local-node entry, which SHALL replace built-in\ndefaults. Repeatable `--provider PROVIDER` SHALL restrict the run to the\ndeduplicated selected providers. `--since-days N` SHALL replace the configured\nhorizon with a positive number of days, while `--all-history` SHALL replace it\nwith no horizon. Supplying both horizon flags SHALL be a typed usage error."}]}
{"claim_id":"configuration/default-file-is-optional","hash":"e5d72611d03402e58377409ca8f7cc70789e39c46daeadb1a5056bea38c6c350","representations":[{"adapter":"markdown","hash":"03fe161d43e6504015028b8c7b09426380c44554b166e80fbc9eeb38ec1c796d","role":"normative","scope":"block","text":"Without `--config`, CASS SHALL inspect its platform configuration path for a\nCASS JSON configuration file. Absence of that default file SHALL preserve\nbuilt-in provider roots and local-only search. `cass status` SHALL report the\nresolved configuration path and whether a file was loaded."}]}
{"claim_id":"configuration/document-version-and-fields-are-validated","hash":"adbf89c00a12a5ca6500e0927d3a7bb374fc82c5555a8eb06833bc32f492bf61","representations":[{"adapter":"markdown","hash":"a4beeaf61cbb79528691e4b750bb9ec870f4f57f3356c52a3efc0a17be320cf6","role":"normative","scope":"block","text":"A loaded configuration SHALL be a JSON object with `version` equal to `1`, an\nexplicit `local_node`, and a nonempty `nodes` array. Unknown fields,\nunsupported versions, or invalid field types SHALL fail with a typed JSON\n`configuration` error."}]}
{"claim_id":"configuration/environment-inputs-are-ignored","hash":"1d5de4aef8c0ec0329f54421afde04aa01123697a0ff08e820ebdec792b1aad4","representations":[{"adapter":"markdown","hash":"e57cac1f8e637edea9c74fae6e2b91672a86b7485ef348d9f5c87bf3c600779d","role":"normative","scope":"block","text":"`CASS_CLAUDE_ROOTS`, `CASS_CODEX_ROOTS`, `CASS_OPENCODE_ROOTS`,\n`CASS_COPILOT_ROOTS`, `CASS_HERMES_ROOTS`, `CASS_PI_ROOTS`, and\n`CASS_SEARCH_NODES` SHALL NOT alter provider discovery or federation selection.\nConfiguration files and supported CLI flags SHALL be the only user-controlled\ninputs for those values."}]}
{"claim_id":"configuration/errors-are-stable-and-nonretryable","hash":"c647ae71dc90516c66184889731a4225d02425b9951cb5d467ab0c02ba973ab3","representations":[{"adapter":"markdown","hash":"07c12f3b6f9b3bfb1616d67319741741aa5747349bb25a2c1e0fa3ea69a12d4d","role":"normative","scope":"block","text":"A configuration failure SHALL exit with code 9 and emit JSON with\n`error.kind` equal to `configuration`, `retryable` false, and no\n`recommended_action`."}]}
{"claim_id":"configuration/explicit-file-is-required","hash":"624262dd61ebea926277cf314d967c9f9e2e7c22db4f516c5212499b8957fcb0","representations":[{"adapter":"markdown","hash":"30fbc8144bfdc30b1935d3daec101bca6d6e91400d02809111a1775db09e1ddb","role":"normative","scope":"block","text":"An explicit `--config PATH` SHALL require a readable regular file. Failure to\nread or parse it SHALL produce a typed JSON `configuration` error without\nopening a database writer, scanning providers, or starting SSH."}]}
{"claim_id":"configuration/index-horizon-is-valid","hash":"6811a1d7a951078bbf9410c14b60e7778608e71c71fb6d43d06ae61bcf5653e4","representations":[{"adapter":"markdown","hash":"dcb8b74599bbcb897c7489b47b433f222ad9c010384ff0092e475f6b0f93e327","role":"normative","scope":"block","text":"Each node MAY contain an `index` object with `since_days` set to an integer from\n1 through 36500 or `null`. Missing `index` or `since_days` SHALL resolve to 90\ndays; `null` SHALL select all history. Zero, negative, out-of-range, fractional,\nor string values SHALL fail with a typed JSON configuration error."}]}
{"claim_id":"configuration/invalid-loaded-file-fails-before-effects","hash":"940f0d72c8127dbff592bab063e19969912e25ee947735282884903e2710e1c5","representations":[{"adapter":"markdown","hash":"6df86f886883de424651228ff8e95fcc167192f528104950ce171f3566d3c609","role":"normative","scope":"block","text":"An existing default configuration file SHALL have the same validation and\npre-effect failure semantics as an explicit file. Each of the six public\ncommands SHALL resolve and validate configuration before performing command\neffects. Hidden federation request workers SHALL neither discover nor load a\nconfiguration file; explicitly combining a hidden worker flag with `--config`\nor `--local-node` SHALL be a typed usage error."}]}
{"claim_id":"configuration/local-node-is-explicit","hash":"a4f7374754dcc758a69222f7230af52586e91546ad68aefbf0cb085e13530fec","representations":[{"adapter":"markdown","hash":"14acc5b3d8f1aa6125d816f137cebfa038d54521eedd18da85eebc8af31e6896","role":"normative","scope":"block","text":"The configured `local_node` SHALL exactly identify one node entry. CASS SHALL\nNOT infer local identity from the operating-system hostname or SSH destination.\nGlobal `--local-node NAME` SHALL override the configured identity and SHALL\nrequire an exact configured node name."}]}
{"claim_id":"configuration/node-inventory-is-valid","hash":"36fc26f8723f79da5f877901292c4f9e026f1a1d53ccc3cc4370d5373abc66d7","representations":[{"adapter":"markdown","hash":"2b0485dad2b339abd16864542eff61a9340c825c4a946565fcef66860da2f774","role":"normative","scope":"block","text":"Node names SHALL be unique. SSH destinations SHALL also be unique so two\nlogical nodes cannot fan out to the same machine. Each node SHALL contain a\nbounded name and SSH destination, an explicit search-participation boolean, and\na providers object. Invalid or duplicate values SHALL fail with a typed JSON\n`configuration` error."}]}
{"claim_id":"configuration/provider-roots-are-valid","hash":"4f5bf0766867b33dda2ead554c0fefbf10233aa58675ac532c3bb7d0375908aa","representations":[{"adapter":"markdown","hash":"eb5b4b280177172e5e2fa50b92a6a3fb692a04f7cba63cea76020448748ecd75","role":"normative","scope":"block","text":"Provider keys SHALL be exactly `claude-code` or `codex`. Each present provider\nSHALL contain a nonempty array of unique absolute root paths. Unsupported\nproviders and duplicate or relative roots SHALL fail with a typed JSON\nconfiguration error."}]}
{"claim_id":"configuration/status-reports-resolved-settings","hash":"51e07ed0b131fdede64075a29524e2c551906bd4415b7e672e829f9274858104","representations":[{"adapter":"markdown","hash":"f2f060a55ebbf9f5c6ebf42702dc27f71128cf0a08430746bf69831b70ec8223","role":"normative","scope":"block","text":"`cass status` SHALL include a `configuration` object containing `path`,\n`loaded`, `local_node`, `providers`, and `index`. `providers` SHALL contain only\nthe resolved local node's enabled provider keys in deterministic Claude\nCode-then-Codex order, each with its ordered `roots`; `index` SHALL contain\nnullable `since_days`. Without a loaded file, `path` SHALL be the absolute\ndefault path, `loaded` false, `local_node` null, `providers` SHALL contain the\ntwo built-in provider root lists, and `since_days` SHALL be 90."}]}
{"claim_id":"distribution/every-build-includes-semantic","hash":"95b52205d2431039c51e6e7d124c12a19a0231318fe9c86b64c930f10128ae07","representations":[{"adapter":"markdown","hash":"b349e69a2cdbfb427aaade94c6e9bc58b8439b08524fa3a2dd888ff88ecb2295","role":"normative","scope":"block","text":"- **WHEN** CI or a developer builds CASS with any supported Cargo invocation\n- **THEN** the resulting binary includes semantic retrieval and enforces semantic readiness before search"}]}
{"claim_id":"distribution/lexical-only-build-works","hash":"579b3c6139707d631c00186aacfca9c33ecb3288027de775ae071a3e6cf2fc56","representations":[{"adapter":"markdown","hash":"b13e3a1aa8c386c1f4af287707cfbf21e15c5c53d98c78565b4f858ea94c88a1","role":"normative","scope":"block","text":"- **WHEN** CASS is built with `--no-default-features`\n- **THEN** indexing and search work through FTS5 and truthfully report semantic support as unavailable"}]}
{"claim_id":"distribution/release-includes-semantic","hash":"1f7c4fccccf3535d19099c88fc866bbeec4e5be196817ae20be4ae5e4ddca08e","representations":[{"adapter":"markdown","hash":"da4b85c24fced90b7a1feac61e186ff2e45af9de076109926b8e771f4f95a9d8","role":"normative","scope":"block","text":"- **WHEN** CI publishes an official CASS binary\n- **THEN** the binary includes the concrete FastEmbed semantic backend"}]}
{"claim_id":"federated-search/concurrent-fanout","hash":"82d06c8d967730df71945cfa02bdbc505d1b4ffdd100f34fec454298e57afe78","representations":[{"adapter":"markdown","hash":"e571a36c4997f60b0a43ece0a74dcd090aa31c00d4085e043a7de283aa0c119a","role":"normative","scope":"block","text":"When nodes are selected, CASS SHALL begin remote searches concurrently while performing the existing local search. Each remote request SHALL use noninteractive SSH, a fixed remote CASS command, structured JSON standard input, and a five-second execution deadline. Query text, filters, limits, and identifiers SHALL NOT be interpolated into a remote shell command."},{"adapter":"markdown","hash":"e95d25fd8ca1ff14575c97c90a2247cfa1a0f929ba394a2de67987e413a913ec","role":"normative","scope":"block","text":"When remote nodes are selected, CASS SHALL begin their configured SSH searches\nconcurrently while performing local hybrid search. Each remote request SHALL\nuse noninteractive SSH, the resolved node's SSH destination, a fixed remote\nCASS command, structured JSON standard input, and the fixed bounded execution\ndeadline. Query text, filters, limits, and identifiers SHALL NOT be\ninterpolated into a remote shell command."}]}
{"claim_id":"federated-search/configured-default-fanout","hash":"c7d039394388890e6417cb47b57e0c3aaf75bbda71a497a4e85f164b1519e3fa","representations":[{"adapter":"markdown","hash":"bf8b389c710667372b779d8152c206ea8ba976cc054e9055e81d2a108cd3aeb0","role":"normative","scope":"block","text":"- **WHEN** Xenia is local and dev-macbook and personal-macbook are search-enabled\n- **THEN** a search without `--node` searches locally and contacts each enabled Mac once"}]}
{"claim_id":"federated-search/deterministic-merge","hash":"90d0ae521b3b04a59bdf5a4e247d63558615832ebcf0b476cebd49c1c7642715","representations":[{"adapter":"markdown","hash":"a50f95069a5735a41743468986a755e3d989deae7c12ab5b739e894fc469c671","role":"normative","scope":"block","text":"CASS SHALL merge node-local final rankings without comparing raw BM25 values between databases. It SHALL assign each candidate a reciprocal local-rank score, deduplicate candidates by provider, conversation identifier, and message identifier, retain the highest rank contribution for a duplicate, record every origin, and break equal aggregate scores deterministically by provider, conversation identifier, and message identifier. The final result count SHALL respect `--limit`."}]}
{"claim_id":"federated-search/local-semantic-readiness-is-required","hash":"c5029fbebc43283aaf8614d0700dd3170e911803ec76aa0ddcb2fc8fb5f7b285","representations":[{"adapter":"markdown","hash":"18b75b17d5229d43dc7c96a92ea96c5af38767f9db6fc3708d6860625cf8f8af","role":"normative","scope":"block","text":"- **WHEN** the local database lacks models or current embeddings\n- **THEN** federated search fails with the local typed readiness error even if a remote node could search successfully"}]}
{"claim_id":"federated-search/node-selection-precedence","hash":"c9d1b21254a0a1d91ea15e4521046c5e20f1889b79276e77f6d2c50105316215","representations":[{"adapter":"markdown","hash":"16cac0af834f710765a0764f3c1a77862dedec653d5cddcf8d79c957389c45b3","role":"normative","scope":"block","text":"`cass search` SHALL accept repeated `--node NAME` values naming configured\nremote nodes. When explicit values are present, CASS SHALL search the local\ndatabase plus the deduplicated named remote subset. Otherwise, with a loaded\nconfiguration, it SHALL search locally plus every other node whose `search`\nvalue is true. The resolved local node SHALL never be contacted through SSH;\nexplicitly naming it SHALL be a typed usage error before local search or SSH.\nWithout configuration or explicit nodes, search SHALL remain local-only and\npreserve the local response shape."},{"adapter":"markdown","hash":"cd5523ac03dea0afec31dc79b46188f058e8295fb9097eea7a8c772688cbae4e","role":"normative","scope":"block","text":"`cass search` SHALL accept repeated `--node <SSH_HOST>` values. When at least one explicit value is present, CASS SHALL use the deduplicated explicit values and ignore `CASS_SEARCH_NODES`. Otherwise it SHALL use the deduplicated, comma-separated nonempty values from `CASS_SEARCH_NODES`. With neither source present, search SHALL remain local-only and SHALL preserve the existing local response shape."}]}
{"claim_id":"federated-search/node-validation","hash":"b8dfde3ebbb961bd189821933c7afbaebaf85a8a922cb673799345dd95d877e9","representations":[{"adapter":"markdown","hash":"8afe0f68cd695652214cdb74c64a7f15faba9eceda320225f504ecaebbea6344","role":"normative","scope":"block","text":"Every selected node SHALL be a nonempty SSH host alias containing only ASCII letters, digits, `.`, `_`, and `-`, beginning with an ASCII letter or digit. `local` SHALL be reserved and rejected as a remote node. Invalid explicit or environment-provided nodes SHALL produce a typed usage error before any SSH process starts."},{"adapter":"markdown","hash":"cafc190d5f41128fc8afefb8b9429b7a594b91cce397ef0bd7a212f452cd37fe","role":"normative","scope":"block","text":"Every configured node name and SSH destination SHALL contain at most 255 ASCII\ncharacters, begin with an ASCII letter or digit, and contain only ASCII letters,\ndigits, `.`, `_`, and `-`. The name `local` SHALL be reserved. An unknown\nexplicit node or invalid configured value SHALL produce a typed error before\nany SSH process starts. CASS SHALL pass the resolved SSH destination as one\nprocess argument and SHALL never interpolate it into a shell command."}]}
{"claim_id":"federated-search/partial-failure","hash":"7144922a0a7562c4a5234c453f0612930855cd2201a792d9138141642921215f","representations":[{"adapter":"markdown","hash":"545d9de2cd20730afca5117cd38d3317a308b1d2cce77b71192057c8d1594948","role":"normative","scope":"block","text":"A remote connection failure, timeout, nonzero exit, malformed response, or incompatible response SHALL NOT suppress successful local or remote results. Federated search SHALL exit successfully when local search succeeds and SHALL include one deterministic outcome for every selected remote node."}]}
{"claim_id":"federated-search/remote-view","hash":"f601922ceb60b58f89c78166fb01d6b445db1b173189b00f18928d1a8b67c43d","representations":[{"adapter":"markdown","hash":"8c603566a29c3468738c3e437e89ebeccadd3a7863632c770c689744a29baf01","role":"normative","scope":"block","text":"`cass view <id> --node NAME --context N` SHALL resolve the configured node name,\nsend the identifier and context through structured standard input to the fixed\nremote CASS command at that node's SSH destination, and return the compatible\nremote JSON view response. The local node, an unknown name, or a node selected\nwithout loaded configuration SHALL fail before SSH. Without `--node`, view\nSHALL retain local behavior."},{"adapter":"markdown","hash":"e0fe591d75983e4a846c1cce2501f47ceb47ba9a522ca89542726089d9c9eb5b","role":"normative","scope":"block","text":"`cass view <id> --node <SSH_HOST> --context N` SHALL validate the node with the search node rules, send the identifier and context through structured standard input to the fixed remote CASS command, and return the compatible remote JSON view response. Without `--node`, view SHALL retain existing local behavior."}]}
{"claim_id":"federated-search/remote-worker-is-nonrecursive","hash":"0d78ff018f10b2d1c80cb0121e4571b13a2b87710dcf28e4cd5bc974d8dc4f73","representations":[{"adapter":"markdown","hash":"c52570a696eba5139ad6db0078953402a1f94575f4c039e1d6c9cbe8ccc5e9e9","role":"normative","scope":"block","text":"The hidden federation request mode SHALL execute exactly one local hybrid\nsearch or one local view operation. It SHALL NOT load configured default nodes,\nhonor federation-selection environment values, or start SSH, even when a\nconfiguration file exists on the remote machine."}]}
{"claim_id":"federated-search/response-provenance","hash":"abdcb0b7f19067179576f98133a4bb0dce4a201b7e62cbcf76595f3979430555","representations":[{"adapter":"markdown","hash":"efd4d7474c85c89f4b2a27c270e9d70a9dbcb4f6ee410205524442675021a591","role":"normative","scope":"block","text":"A federated search response SHALL identify its realized mode as `federated`, attach an ordered nonempty `origins` array and a federated rank score to every returned result, and include remote node outcomes. Local-only responses SHALL omit federated-only result and response fields."}]}
{"claim_id":"federated-search/semantic-unready-node-is-partial-failure","hash":"96804a1ca41a77dd72dc0454da2fa47cb9764611c93940edfb698e60c8e6dfa8","representations":[{"adapter":"markdown","hash":"c5be5b6ca0f7fbb3532cd5ea53bee5330d1c5f8d109e59afcb67ee0c2919dbd2","role":"normative","scope":"block","text":"- **WHEN** local hybrid search succeeds, one remote node returns hybrid results, and another remote node lacks models or current embeddings\n- **THEN** the response contains local and successful remote results plus an error outcome for the semantically unready node"}]}
{"claim_id":"federated-search/successful-nodes-are-hybrid","hash":"360579cd5cd0e7c4282952080ec39f7d5767e4082f232f503f11053ae0f5da43","representations":[{"adapter":"markdown","hash":"af05ec737467d2a8ac40d9f67ee2d8603d5d9da25b4731a82863414148cb77c6","role":"normative","scope":"block","text":"- **WHEN** local search and one remote search are semantically ready while another remote is not ready\n- **THEN** the aggregate reports federated realization, successful outcomes report hybrid realization, and the unready outcome reports an error without results"}]}
{"claim_id":"independence/no-dickles-franken-surface","hash":"d6b767c47d610e6e362cec8b43ffa1b613594071d45941925f92bac850ce8985","representations":[{"adapter":"markdown","hash":"a30a308486976091f150a1ba359e80d439dd70204edfa577ef9016486be13d81","role":"normative","scope":"block","text":"- **WHEN** final manifests, lockfiles, build scripts, source, tests, workflows,\n  and maintained documentation are scanned\n- **THEN** prohibited legacy dependency surfaces and removed provider surfaces\n  are absent"}]}
{"claim_id":"indexing/canonical-and-fts-are-atomic","hash":"fb672125d9abc56e39341197ef60b1f2e6da289273ea2afaf229ebf74c6b13cc","representations":[{"adapter":"markdown","hash":"7db813c6697e50ec23ae7a0de84b31abdcbe8bbc2ec6e626bdcfdb2a6d892f41","role":"normative","scope":"block","text":"- **WHEN** a writer transaction fails before its checkpoint commits\n- **THEN** neither that transaction's canonical changes nor its row-level or rebuilt FTS state is visible after rollback"}]}
{"claim_id":"indexing/cli-provider-selection-is-bounded","hash":"a30f0867ee62cf73c041b69672cdc76dd3081af9b46e11fd8b7a4f35d32e1406","representations":[{"adapter":"markdown","hash":"8268080672d0173e3c707f785c5e1c586756d4c09f692c755fb4fbbc65a22970","role":"normative","scope":"block","text":"`cass index` SHALL accept repeatable `--provider PROVIDER` values. Explicit\nprovider selection SHALL restrict that run to the deduplicated named supported\nproviders. Unknown providers or an explicitly selected provider without\nconfigured or built-in roots SHALL fail with a typed JSON usage error before\nscanning. CASS SHALL NOT expose an ad hoc root override."}]}
{"claim_id":"indexing/complete-scan-purges-missing-source","hash":"115f85386aa6e0bc623e4798cc99209e0a41f4e38a7ad65e8986f95437b05558","representations":[{"adapter":"markdown","hash":"bed25d9a5087c99c695a29012de838c53862611263e635b539225aec3464556b","role":"normative","scope":"block","text":"- **WHEN** a complete successful provider scan no longer discovers a previously indexed source\n- **THEN** its conversation, messages, FTS rows, and embeddings are removed"}]}
{"claim_id":"indexing/concurrent-writer-is-rejected","hash":"f598d48ca373c6864c3bc34ee48b9e5c0305d9d87d34d4395795239a7a3217b1","representations":[{"adapter":"markdown","hash":"226db7a26299279bcb302ddb7b0b022e0a4ec7692b08def59647e2b89abb2c0c","role":"normative","scope":"block","text":"- **WHEN** a second `cass index` targets a database with an active index writer\n- **THEN** it returns a typed JSON busy error without starting a competing refresh"}]}
{"claim_id":"indexing/full-rebuild-is-explicit","hash":"bc0285be08584f118ededbaaa8e3c11a73012e32ad710dfe8870a02a84eb8ef0","representations":[{"adapter":"markdown","hash":"1914df8836455c0099f1302dfa929e5568ac2f277f1e698d417b99ed5461af33","role":"normative","scope":"block","text":"- **WHEN** `cass index --full` is invoked\n- **THEN** CASS may rebuild whole-corpus FTS and semantic derived state while preserving canonical message identity"}]}
{"claim_id":"indexing/inaccessible-roots-never-authorize-purge","hash":"76e7dedb042e69fbd69c556031a88044c5c88865414901728af93d1509a17878","representations":[{"adapter":"markdown","hash":"7724d68d2c8d0c6d0258248a2b3ba7c0a3244ae88a431dd6b9e0824287cb0699","role":"normative","scope":"block","text":"Every configured root for a selected provider SHALL be inspected successfully\nbefore that provider's scan is considered complete. A missing, unreadable, or\ndisappearing configured root SHALL return a typed JSON error, mark the provider\nscan incomplete, and preserve every existing canonical row, derived-search\nrow, checkpoint, and tombstone for that provider."}]}
{"claim_id":"indexing/incomplete-scan-preserves-state","hash":"436d042e7f365674f6c6de70b996aa09b119289d6cfd6e57ae11ae7a2bfd0c10","representations":[{"adapter":"markdown","hash":"13327d93bb327fbcf8dbdb26921fad67bc39119b7f4d2edbccc6455ee983c6f5","role":"normative","scope":"block","text":"- **WHEN** provider discovery or parsing fails before a complete scan is established\n- **THEN** previously indexed conversations are not purged as missing"}]}
{"claim_id":"indexing/only-changed-messages-refresh","hash":"095392996b0d72e2f75da838693faac50b1145333135319842e9667aa0cd789f","representations":[{"adapter":"markdown","hash":"4be8a2afc4faad45c808d65788dd643266353548a53aa21105d746dd0441882a","role":"normative","scope":"block","text":"- **WHEN** a previously indexed source contains added or changed messages\n- **THEN** only those messages require new canonical writes and semantic embeddings"},{"adapter":"markdown","hash":"5500749b1b4f345e20031e0aaee7fa207338571cf6906529da548efaff342ba7","role":"normative","scope":"block","text":"- **WHEN** a writer transaction contains fewer changed or removed messages than the declared FTS rebuild cutoff and the embedding generation is unchanged\n- **THEN** only those messages receive canonical and FTS mutations and only added or changed messages receive new embeddings"}]}
{"claim_id":"indexing/partial-provider-scan-preserves-others","hash":"53f4f726c44afd7d9461f74f04aac7ab5119defd3ddff0486d462270a7b4fbab","representations":[{"adapter":"markdown","hash":"8d23d17b386dfe38be41005bd6a2dcca1fd0608cdb5e7e7a1d8b0766780f4e66","role":"normative","scope":"block","text":"An index run restricted by `--provider` SHALL reconcile missing sources only\nfor providers actually scanned completely. It SHALL preserve\ncanonical conversations, FTS rows, embeddings, checkpoints, and tombstones for\nall unselected providers."}]}
{"claim_id":"indexing/recency-exclusion-preserves-stored-state","hash":"c464a201c452907ff59f452d428f5baaf6537a3cadfe7535f97618b24b19e9b2","representations":[{"adapter":"markdown","hash":"de4a599b307639263d33eb9df273c06ff8d41767196c897016d788e9c56bcecb","role":"normative","scope":"block","text":"Sources excluded only by the recency horizon SHALL never authorize deletion of\ntheir existing canonical rows, FTS rows, embeddings, checkpoints, or\ntombstones. The horizon is an admission/work limit, not an automatic retention\npolicy."}]}
{"claim_id":"indexing/recency-horizon-bounds-admission-not-retention","hash":"034e3715eeaeaa70614982ab87bec7f37ed94e04892bfe867dee05ee79fe3623","representations":[{"adapter":"markdown","hash":"94714cc7037cc86f85d20340d64fcb3d87d7ae68753b0649e65aa05a1ad4acbb","role":"normative","scope":"block","text":"The resolved recency horizon SHALL determine source eligibility using the\nsource file's modification time relative to one run-start timestamp. A source\nwhose modification time is on or after the inclusive cutoff SHALL be eligible;\nan older source SHALL not be parsed, inserted, updated, or counted as missing.\nWhen a source is eligible, CASS SHALL ingest its complete conversation rather\nthan truncate messages at the cutoff. With no horizon, every discovered source\nSHALL be eligible."}]}
{"claim_id":"indexing/unchanged-source-is-skipped","hash":"51341dcf1f438d7bf6e55a611ba48a1e7e185ff79b33472639f8ed33cec2035b","representations":[{"adapter":"markdown","hash":"3227f3eaeb6ad2168bc8abe3ae70c3d83565de8b972acffd38d1da27710cbb27","role":"normative","scope":"block","text":"- **WHEN** `cass index` sees a source whose fingerprint is unchanged\n- **THEN** it reports the source unchanged without rewriting its messages or embeddings"},{"adapter":"markdown","hash":"7939b341f02d9f2c9329279a485da600c840c1dab499f1a4fc05d6a0741cbd3d","role":"normative","scope":"block","text":"- **WHEN** `cass index` sees a source whose fingerprint is unchanged\n- **THEN** it reports the source unchanged without parsing it or rewriting its messages, FTS rows, or embeddings"}]}
{"claim_id":"ingestion/configured-provider-roots-index","hash":"9a5f4216f887290ea9aec1e901b723699c2d4f55c37aa956ea7c2ce2652ba03e","representations":[{"adapter":"markdown","hash":"104849741869b2bbcf9c9f6c7c18e7aa62911178c6aa2a82388db9c3128f33da","role":"normative","scope":"block","text":"- **WHEN** the resolved local node enables Claude Code and Codex with valid roots\n- **THEN** `cass index` scans those roots and does not scan absent providers"}]}
{"claim_id":"ingestion/malformed-records-do-not-panic","hash":"c9e3ce1136ed3ae577e3e965a05f9e479893dd65b3bb599038cf53a56bf66130","representations":[{"adapter":"markdown","hash":"ab50749a83e68c59b27f60f54c300e4eda20310d551fb653ec7a18fb9e25f819","role":"normative","scope":"block","text":"- **WHEN** a supported history file contains a malformed record\n- **THEN** indexing returns a typed JSON error or bounded diagnostic without panicking"},{"adapter":"markdown","hash":"da184d5c61c907f9716ca818a4dc420ad728ef2e6f48371f29b7a804cac7d26d","role":"normative","scope":"block","text":"- **WHEN** a supported JSONL file contains a malformed record\n- **THEN** indexing returns a typed JSON error or bounded diagnostic without panicking"}]}
{"claim_id":"ingestion/provider-boundary","hash":"f13310489d6d7abb912621e000bb2e96bcc8f02b3d103abd80ce935bb82f6899","representations":[{"adapter":"markdown","hash":"5a2f840838a6cbcdd5a59bd917da4bccd0d147684cb92cc3b4c6d345f03f010f","role":"normative","scope":"block","text":"The system SHALL discover and normalize only Claude Code and Codex histories\ninto CASS-owned canonical conversation and message records. With a loaded\nconfiguration, provider presence in the resolved local node's `providers`\nobject SHALL enable that provider and its configured roots; absent providers\nSHALL not be scanned. Without a loaded configuration, these two concrete\nproviders SHALL retain their built-in local roots. OpenCode, GitHub Copilot\nCLI, Hermes Agent, Pi, and every other provider SHALL have no discovery or\nconfiguration surface."},{"adapter":"markdown","hash":"bd9ed507c49f8afa3a1bdf55e269fa1cc64c0b6d16c40dbe4ef59424e42d7adb","role":"normative","scope":"block","text":"The system SHALL discover and normalize Claude Code, Codex, current OpenCode,\nGitHub Copilot CLI, Hermes Agent, and Pi histories into CASS-owned canonical\nconversation and message records."}]}
{"claim_id":"ingestion/supported-jsonl-indexes","hash":"452454020b1b7d7012e52e8bf377ea224f94794b46b35f02da977b4c3aecbbdb","representations":[{"adapter":"markdown","hash":"d5ac3d891d11093ab0503a058cadec119668a920db578d7d46dde31d0201fe5c","role":"normative","scope":"block","text":"- **WHEN** configured roots contain representative histories from each of the six supported providers\n- **THEN** `cass index` persists their conversations and messages with stable IDs"}]}
{"claim_id":"ingestion/unsupported-providers-ignored","hash":"d310f68a8cff8aafab63e4681b539e6416abc0e01639e3d20708f9f7addb3372","representations":[{"adapter":"markdown","hash":"889b5cd7a51774c1a8f99e8eca5c3d02b38e2a23acc6ac5f30b99e3e3b57d0ea","role":"normative","scope":"block","text":"- **WHEN** a root contains only another provider's history\n- **THEN** no conversation from that provider is indexed or advertised as supported"},{"adapter":"markdown","hash":"f383df1b86e8bad520167303ed0758acf90f8e56fabd52e2e28693ee4bbb6ad2","role":"normative","scope":"block","text":"- **WHEN** a configured supported root contains only another provider's history\n- **THEN** no conversation from that provider is indexed or advertised as supported"}]}
{"claim_id":"models/download-is-explicit","hash":"8be95b4266aac7a2c12954a01f59f91f5858beb42ced88303ee480260e629ce0","representations":[{"adapter":"markdown","hash":"a92d3642742c6a85f8e62cf5545e602b5256b4f5c32bd745d09c2089953eeaf8","role":"normative","scope":"block","text":"- **WHEN** models are absent and no `models install` command is run\n- **THEN** `index`, `search`, and `status` do not download model assets"},{"adapter":"markdown","hash":"ca2f25ffec7f703bf637cb590fc09460908e3c3e5da89fb51938327afc1b0775","role":"normative","scope":"block","text":"- **WHEN** models are absent and no `models install` command is run\n- **THEN** CASS does not download models implicitly"}]}
{"claim_id":"search/fts-contributes-to-hybrid","hash":"5c55f4722cae491c181e9ea8b83cd7ca6a8ba584826a92fb9655323db27309af","representations":[{"adapter":"markdown","hash":"0a78195b69660b6a64adffed12ef36c9c1a40fede2788544c8935d476799cb30","role":"normative","scope":"block","text":"- **WHEN** current semantic models and embeddings are ready and an indexed message contains a distinctive query term\n- **THEN** `cass search` may retrieve that message through FTS5, includes it in fusion and reranking, and reports hybrid realization"}]}
{"claim_id":"search/lexical-returns-distinctive-match","hash":"3e8e35e16fffdfb23b18df3c23c455a2077a6392c9ef0145b883242de6f73f7c","representations":[{"adapter":"markdown","hash":"4028e6706bfd56425643854e68a9d44f1b61382582f143aacea1c80aac34bc72","role":"normative","scope":"block","text":"- **WHEN** an indexed message contains a distinctive query term\n- **THEN** `cass search` returns that message with a stable identifier and lexical score metadata"}]}
{"claim_id":"search/mixed-message-excludes-tool-result-text","hash":"16656776abadb6bd1c84693de90f842e2c451a62324bcfd3f195b578d8a033db","representations":[{"adapter":"markdown","hash":"f6638a98d9af34414c081bda5e60d744a503836f73b41550d09549f91b73fd74","role":"normative","scope":"block","text":"- **WHEN** one canonical message contains conversational text and a structured tool-result block\n- **THEN** its conversational text can participate in FTS and embeddings while terms unique to the tool-result block cannot"}]}
{"claim_id":"search/tool-results-are-not-searchable","hash":"b38816c03254b1d881eb46d3afb1236de66fa38c01be2f3cedd897f4500224b2","representations":[{"adapter":"markdown","hash":"f818935b4e7edd4ceff89249e67f4ceab4e917c5e146cc29fb0381b5cadfa1f0","role":"normative","scope":"block","text":"- **WHEN** a term occurs only inside a pure tool-result message\n- **THEN** `cass search` does not return that message and semantic readiness does not require an embedding for it"}]}
{"claim_id":"semantic/hybrid-reranks-with-models","hash":"cf40c3d4d474389dadcbf6d20ae0ce1fb89c22e2d38374724a1f6a00afc00ac7","representations":[{"adapter":"markdown","hash":"3d530489e35c508663ba4df1250694a3e01efbefbd5b5c8248a61d4d39613c33","role":"normative","scope":"block","text":"- **WHEN** compatible models are installed and every searchable message has a current-generation embedding\n- **THEN** `cass search` reports hybrid realization and returns fused, reranked candidates"},{"adapter":"markdown","hash":"ae1d7841370533656fe6376b0474d03fa509f8c7933650ec5d1c4fb4a3fe8a26","role":"normative","scope":"block","text":"- **WHEN** compatible embedding and reranking models are installed\n- **THEN** search reports hybrid realization and returns fused, reranked candidates"}]}
{"claim_id":"semantic/index-requires-models","hash":"84b0808159b76cbbcf1b11fb72327f7fcf6d87f6de77c143386a565823c49682","representations":[{"adapter":"markdown","hash":"c8dd82dc54e2cf3770d946ff148edc091ba86101b08e44e6f882fdaf039f0ea2","role":"normative","scope":"block","text":"- **WHEN** semantic models are not installed and `cass index` is invoked\n- **THEN** indexing exits unsuccessfully with JSON `error.kind` equal to `model` and `error.recommended_action` equal to `models install` before opening or creating the database writer or parsing source content"}]}
{"claim_id":"semantic/inference-failure-fails-search","hash":"f2708c5d107ebeab08769e99ba445a8719545a33be94dbfeee51ac869eef2427","representations":[{"adapter":"markdown","hash":"ea2f39fff93d54fa5988a1a7701bcd0777edb6a26af4ae767d0d10fe24adad0f","role":"normative","scope":"block","text":"- **WHEN** installed semantic assets cannot load or embedding or reranking inference fails\n- **THEN** `cass search` exits unsuccessfully with JSON `error.kind` equal to `model`, an applicable explicit recommended action, no results or fallback fields, and never returns lexical fallback results"}]}
{"claim_id":"semantic/inference-failure-falls-back","hash":"031bb07c1c137674ee4ea0a4972a766951b4b426df289969db9aab275fd9e4c9","representations":[{"adapter":"markdown","hash":"1fbdb41c049466aaa2a79640d0b5defb01d982c31f80c34755b17a8593504579","role":"normative","scope":"block","text":"- **WHEN** installed semantic assets cannot load or inference fails\n- **THEN** search still succeeds through FTS5 and reports the semantic failure and lexical realization"}]}
{"claim_id":"semantic/missing-embeddings-fail-search","hash":"d7f50eb9ad7c7d618801d8a360f903c1fc540415edb8c6d8e84b0eab49fd3d90","representations":[{"adapter":"markdown","hash":"fd1b9025d58ae9d1931b8fa473d8c2c628d8ed409fb0a25da6650a53d1bd1c8b","role":"normative","scope":"block","text":"- **WHEN** models are installed but any searchable message lacks a current-generation embedding\n- **THEN** `cass search` exits unsuccessfully with JSON `error.kind` equal to `search-not-ready`, `error.recommended_action` equal to `index`, and no results or fallback fields"}]}
{"claim_id":"semantic/missing-models-fail-search","hash":"4fd4caa9313de1c1e73526203a3a82d26b90d710dcc876f4d1ca0c2005f8cf49","representations":[{"adapter":"markdown","hash":"59da39a63115b6953e6663b3a7a5d34929d927d67c19646ee79034f65ce985c8","role":"normative","scope":"block","text":"- **WHEN** semantic models are not installed\n- **THEN** `cass search` exits unsuccessfully with JSON `error.kind` equal to `model`, `error.recommended_action` equal to `models install`, no results or fallback fields, and no lexical results"}]}
{"claim_id":"semantic/missing-models-fall-back","hash":"ef292bd134fe67748ac00d4b258c3510c20fc9d7658c138f9636fe3abe5a6ad0","representations":[{"adapter":"markdown","hash":"0d9d6aadb4907046c0ce5b3fb5f560fb03251038982df95084cacaa697e52be1","role":"normative","scope":"block","text":"- **WHEN** semantic models are not installed\n- **THEN** search succeeds lexically and truthfully reports lexical fallback"}]}
{"claim_id":"semantic/stale-embedding-generation-invalidated","hash":"886515892f30db0ddc1d32799d1f3316819b8ece7ca5b4a19bd9f488c7554bfe","representations":[{"adapter":"markdown","hash":"8661538469fd6377d2b5349a36467238d217e04f1840cc2bbf7d1caa780868a3","role":"normative","scope":"block","text":"- **WHEN** the configured embedding model or stored-vector schema identity changes\n- **THEN** old vectors are excluded immediately and search remains unavailable until `cass index` replaces them with current-generation vectors"},{"adapter":"markdown","hash":"a702650bec890a21abecb5b09ebb30389c7aa3e6871258a419c294d4d214c7d2","role":"normative","scope":"block","text":"- **WHEN** the configured embedding model or stored-vector schema identity changes\n- **THEN** old vectors are excluded immediately and the next index replaces them with current-generation vectors"}]}
{"claim_id":"status/missing-database-recommends-index","hash":"97e0290fec90f2c997041ff1694b9a25b53955707410c882f866e831ab74f1b1","representations":[{"adapter":"markdown","hash":"4ecbcfeaf79741281840a03b0e0b16bf18121978ac73d6061e109209c68dec18","role":"normative","scope":"block","text":"- **WHEN** no canonical database exists\n- **THEN** `status` reports not-ready state and `index` as the direct action"},{"adapter":"markdown","hash":"8783e769f24a1caf0925829bbad226f3cf73568e38d121a12768409d02f03554","role":"normative","scope":"block","text":"- **WHEN** compatible models are installed but no canonical database exists\n- **THEN** `status` reports search not ready and recommends `index`"}]}
{"claim_id":"status/missing-embeddings-recommends-index","hash":"fc9e744cfac7790988cbc4c454acc96214b380eadfb52add5f96df79afd4ca41","representations":[{"adapter":"markdown","hash":"98ecc61e650f3876004ec7b10a4a398e029de876e6ad7acc175dd5b051e06640","role":"normative","scope":"block","text":"- **WHEN** compatible models are installed but current embedding coverage is incomplete\n- **THEN** `status` reports search not ready and recommends `index`"}]}
{"claim_id":"status/missing-models-recommends-install","hash":"54a9c6f8518e67b7f5d7f3d7e66aba9931b91da7ba525a9deff92f72a352ad47","representations":[{"adapter":"markdown","hash":"450bdbb4f4e80ad4032087a5fd1a276b8d3574d80691ba4bbf7e0ffc8a476d6e","role":"normative","scope":"block","text":"- **WHEN** compatible models are not installed, whether or not the canonical database exists\n- **THEN** `status` reports search not ready and recommends `models install`"}]}
{"claim_id":"status/semantic-search-ready","hash":"72fcc55af6ea2dca10674837fee20afbadd9cb6c05a60791b274350cbaabbdce","representations":[{"adapter":"markdown","hash":"d8cc59a80122dea8a942333dbd46c5f9b034a9ce94e4bfaae7019fe8908f73a2","role":"normative","scope":"block","text":"- **WHEN** compatible models are installed and current embedding coverage equals the searchable message count\n- **THEN** `status` reports search ready with hybrid realization and no recommended action"}]}
{"claim_id":"status/zero-searchable-messages-can-be-ready","hash":"e5a07d3986c55bf4adda6ed96bfba827796a1d69bfdbf4a285664452bb55eeb8","representations":[{"adapter":"markdown","hash":"42557ee8732b4c9e9934fbb8384ad7caf7b42316d0329375362a93d770e6aec5","role":"normative","scope":"block","text":"- **WHEN** compatible models are installed and the database contains canonical messages but zero searchable messages and zero current embeddings\n- **THEN** `status` reports search ready with hybrid realization and no recommended action"}]}
{"claim_id":"storage/forget-persists-through-indexing","hash":"22825fcd449c71dc19b18e69ff2c3a0242bbbb24648c9445a83cba908fd59d46","representations":[{"adapter":"markdown","hash":"791471e15047cc13780632f4ebdb875a15690923daf34e6b7ee6ed9779a5c044","role":"normative","scope":"block","text":"- **WHEN** a forgotten source remains present during later indexing\n- **THEN** its durable tombstone prevents the conversation from being reinserted"}]}
