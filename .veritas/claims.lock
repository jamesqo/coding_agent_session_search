{"claim_id":"storage/tool-search-projection-migrates","hash":"4e1b405ad04f5e454b867a2aa63b8cbefa66b760fcd9fdd06c2cc9070576db6f","representations":[{"adapter":"markdown","hash":"21c7243e9e621affd07fbf54e725909135ca6cb2422a9049e7ec3f29f74d66e6","role":"normative","scope":"block","text":"- **WHEN** CASS opens a supported database created before tool-result search exclusion\n- **THEN** it preserves canonical messages, invalidates derived search readiness, and requires re-indexing source histories before search can succeed"}]}
