{"claim_id":"status/zero-searchable-messages-can-be-ready","hash":"e5a07d3986c55bf4adda6ed96bfba827796a1d69bfdbf4a285664452bb55eeb8","representations":[{"adapter":"markdown","hash":"42557ee8732b4c9e9934fbb8384ad7caf7b42316d0329375362a93d770e6aec5","role":"normative","scope":"block","text":"- **WHEN** compatible models are installed and the database contains canonical messages but zero searchable messages and zero current embeddings\n- **THEN** `status` reports search ready with hybrid realization and no recommended action"}]}
{"claim_id":"storage/forget-persists-through-indexing","hash":"22825fcd449c71dc19b18e69ff2c3a0242bbbb24648c9445a83cba908fd59d46","representations":[{"adapter":"markdown","hash":"791471e15047cc13780632f4ebdb875a15690923daf34e6b7ee6ed9779a5c044","role":"normative","scope":"block","text":"- **WHEN** a forgotten source remains present during later indexing\n- **THEN** its durable tombstone prevents the conversation from being reinserted"}]}
{"claim_id":"storage/forget-removes-conversation","hash":"550e96e36d1fe30d399b9900c569f00b9d988e51fa86bb31e8a5e920459ef920","representations":[{"adapter":"markdown","hash":"873a2e15eb68cf6856f0593603bbb8acc0b5e6e7340a7e8815308d26ca66becf","role":"normative","scope":"block","text":"- **WHEN** `cass forget <id>` succeeds\n- **THEN** the conversation, its messages, and derived search rows are no longer retrievable and later indexing does not restore it"}]}
{"claim_id":"storage/full-rebuild-is-idempotent","hash":"c1d3533d867408c224baa13a02f8fe7661bc6a56cff7f8cd1e1d39e3e4d9cee0","representations":[{"adapter":"markdown","hash":"a97dceb88c2b368399b5ae740161f848cbd9961b5f973ff09665389bd17ca002","role":"normative","scope":"block","text":"- **WHEN** `cass index --full` runs against an existing canonical database\n- **THEN** derived lexical and semantic state is recreated without duplicating canonical messages"}]}
{"claim_id":"storage/newer-schema-is-rejected","hash":"838994cf095fecf73e2db827208407ac347049e9731e7f11011218ddef393713","representations":[{"adapter":"markdown","hash":"c34b76f1df499fba3feb8d94a2f718aa78ab77af8df52013d1bd3a906986790f","role":"normative","scope":"block","text":"- **WHEN** CASS opens a database whose schema version is newer than the binary supports\n- **THEN** it returns a typed JSON incompatibility error without modifying the database"}]}
