{"claim_id":"status/missing-models-recommends-install","hash":"54a9c6f8518e67b7f5d7f3d7e66aba9931b91da7ba525a9deff92f72a352ad47","representations":[{"adapter":"markdown","hash":"450bdbb4f4e80ad4032087a5fd1a276b8d3574d80691ba4bbf7e0ffc8a476d6e","role":"normative","scope":"block","text":"- **WHEN** compatible models are not installed, whether or not the canonical database exists\n- **THEN** `status` reports search not ready and recommends `models install`"}]}
