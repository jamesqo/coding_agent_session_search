{"claim_id":"search/tool-results-are-not-searchable","hash":"b38816c03254b1d881eb46d3afb1236de66fa38c01be2f3cedd897f4500224b2","representations":[{"adapter":"markdown","hash":"f818935b4e7edd4ceff89249e67f4ceab4e917c5e146cc29fb0381b5cadfa1f0","role":"normative","scope":"block","text":"- **WHEN** a term occurs only inside a pure tool-result message\n- **THEN** `cass search` does not return that message and semantic readiness does not require an embedding for it"}]}
{"claim_id":"semantic/hybrid-reranks-with-models","hash":"cf40c3d4d474389dadcbf6d20ae0ce1fb89c22e2d38374724a1f6a00afc00ac7","representations":[{"adapter":"markdown","hash":"3d530489e35c508663ba4df1250694a3e01efbefbd5b5c8248a61d4d39613c33","role":"normative","scope":"block","text":"- **WHEN** compatible models are installed and every searchable message has a current-generation embedding\n- **THEN** `cass search` reports hybrid realization and returns fused, reranked candidates"},{"adapter":"markdown","hash":"ae1d7841370533656fe6376b0474d03fa509f8c7933650ec5d1c4fb4a3fe8a26","role":"normative","scope":"block","text":"- **WHEN** compatible embedding and reranking models are installed\n- **THEN** search reports hybrid realization and returns fused, reranked candidates"}]}
{"claim_id":"semantic/index-requires-models","hash":"84b0808159b76cbbcf1b11fb72327f7fcf6d87f6de77c143386a565823c49682","representations":[{"adapter":"markdown","hash":"c8dd82dc54e2cf3770d946ff148edc091ba86101b08e44e6f882fdaf039f0ea2","role":"normative","scope":"block","text":"- **WHEN** semantic models are not installed and `cass index` is invoked\n- **THEN** indexing exits unsuccessfully with JSON `error.kind` equal to `model` and `error.recommended_action` equal to `models install` before opening or creating the database writer or parsing source content"}]}
{"claim_id":"semantic/inference-failure-fails-search","hash":"f2708c5d107ebeab08769e99ba445a8719545a33be94dbfeee51ac869eef2427","representations":[{"adapter":"markdown","hash":"ea2f39fff93d54fa5988a1a7701bcd0777edb6a26af4ae767d0d10fe24adad0f","role":"normative","scope":"block","text":"- **WHEN** installed semantic assets cannot load or embedding or reranking inference fails\n- **THEN** `cass search` exits unsuccessfully with JSON `error.kind` equal to `model`, an applicable explicit recommended action, no results or fallback fields, and never returns lexical fallback results"}]}
