{"claim_id":"view/context-clamps-to-conversation","hash":"c4fb3a3952d84531e99ea6862938e2c2b0ba4261736ccb89b0be682a06f3c354","representations":[{"adapter":"markdown","hash":"b946ad2b8f19283683058ce1eaab36316a3f97fc8e1f8f5c09c65fb1d9898291","role":"normative","scope":"block","text":"- **WHEN** requested context extends before the first or after the last message\n- **THEN** `view` returns only existing messages in canonical order"}]}
{"claim_id":"view/tool-results-remain-visible","hash":"d3ce1390504783709411d253e287a9d841c439d613d973c433d11a88f6678de8","representations":[{"adapter":"markdown","hash":"f6448cbffeea16e368b8ef9fafb57d1a0df8efbd97098a832ed0851d4393bc82","role":"normative","scope":"block","text":"- **WHEN** `cass view` returns context containing a tool result excluded from search\n- **THEN** the response contains that tool result's complete retained canonical content in conversation order"}]}
