{"claim_id":"cli/bare-invocation-prints-help","hash":"7d6d9a6a3edcdb46efda930f8568d133838686a3fda13d097bf19e8744873c71","representations":[{"adapter":"markdown","hash":"7154813b503b4630efd5783fe7db21b90db7eec53695e2c4b9e74891236da49d","role":"normative","scope":"block","text":"- **WHEN** `cass` is invoked without a command\n- **THEN** it prints concise help without launching an interactive interface"}]}
{"claim_id":"cli/operational-command-surface","hash":"b780fe1f3870958eb3433d1f4e128bdd99a87024ea60ec731247d9a4a08fe07b","representations":[{"adapter":"markdown","hash":"e89e1b809ba065f696ea3b771ed6878fa91362df98d958e6de9af1666250cffc","role":"normative","scope":"block","text":"The system SHALL expose only `index`, `search`, `view`, `status`, `forget`, and\n`models install` as operational commands. Operational output SHALL be JSON."}]}
{"claim_id":"cli/removed-commands-are-rejected","hash":"28502e5b8f09e91138bb0aacb8a7b534c0efcc0e38bb26832d30d653e103710b","representations":[{"adapter":"markdown","hash":"651347302a5974f974a69d6c756d1262fcdda6945c65d9f59ad01af5294fa8e3","role":"normative","scope":"block","text":"- **WHEN** a removed command such as `export`, `doctor`, `list`, or `sources` is invoked\n- **THEN** argument parsing fails without compatibility rewriting"}]}
{"claim_id":"distribution/lexical-only-build-works","hash":"579b3c6139707d631c00186aacfca9c33ecb3288027de775ae071a3e6cf2fc56","representations":[{"adapter":"markdown","hash":"b13e3a1aa8c386c1f4af287707cfbf21e15c5c53d98c78565b4f858ea94c88a1","role":"normative","scope":"block","text":"- **WHEN** CASS is built with `--no-default-features`\n- **THEN** indexing and search work through FTS5 and truthfully report semantic support as unavailable"}]}
{"claim_id":"distribution/release-includes-semantic","hash":"1f7c4fccccf3535d19099c88fc866bbeec4e5be196817ae20be4ae5e4ddca08e","representations":[{"adapter":"markdown","hash":"da4b85c24fced90b7a1feac61e186ff2e45af9de076109926b8e771f4f95a9d8","role":"normative","scope":"block","text":"- **WHEN** CI publishes an official CASS binary\n- **THEN** the binary includes the concrete FastEmbed semantic backend"}]}
{"claim_id":"federated-search/concurrent-fanout","hash":"d1cda9c914473385dc47b85a5ad5eb9152d2e3a6106b4fc8e52a1e3e36c621a6","representations":[{"adapter":"markdown","hash":"e571a36c4997f60b0a43ece0a74dcd090aa31c00d4085e043a7de283aa0c119a","role":"normative","scope":"block","text":"When nodes are selected, CASS SHALL begin remote searches concurrently while performing the existing local search. Each remote request SHALL use noninteractive SSH, a fixed remote CASS command, structured JSON standard input, and a five-second execution deadline. Query text, filters, limits, and identifiers SHALL NOT be interpolated into a remote shell command."}]}
{"claim_id":"federated-search/deterministic-merge","hash":"90d0ae521b3b04a59bdf5a4e247d63558615832ebcf0b476cebd49c1c7642715","representations":[{"adapter":"markdown","hash":"a50f95069a5735a41743468986a755e3d989deae7c12ab5b739e894fc469c671","role":"normative","scope":"block","text":"CASS SHALL merge node-local final rankings without comparing raw BM25 values between databases. It SHALL assign each candidate a reciprocal local-rank score, deduplicate candidates by provider, conversation identifier, and message identifier, retain the highest rank contribution for a duplicate, record every origin, and break equal aggregate scores deterministically by provider, conversation identifier, and message identifier. The final result count SHALL respect `--limit`."}]}
{"claim_id":"federated-search/node-selection-precedence","hash":"1eb91722f3731f93dda1f0b59ae6602fe71a895faa866ba415c3adf45a2c4c76","representations":[{"adapter":"markdown","hash":"cd5523ac03dea0afec31dc79b46188f058e8295fb9097eea7a8c772688cbae4e","role":"normative","scope":"block","text":"`cass search` SHALL accept repeated `--node <SSH_HOST>` values. When at least one explicit value is present, CASS SHALL use the deduplicated explicit values and ignore `CASS_SEARCH_NODES`. Otherwise it SHALL use the deduplicated, comma-separated nonempty values from `CASS_SEARCH_NODES`. With neither source present, search SHALL remain local-only and SHALL preserve the existing local response shape."}]}
{"claim_id":"federated-search/node-validation","hash":"23c72c3599eee6cb470969cf603617ac1d37d3ea401ea7e58431610a3d177eef","representations":[{"adapter":"markdown","hash":"8afe0f68cd695652214cdb74c64a7f15faba9eceda320225f504ecaebbea6344","role":"normative","scope":"block","text":"Every selected node SHALL be a nonempty SSH host alias containing only ASCII letters, digits, `.`, `_`, and `-`, beginning with an ASCII letter or digit. `local` SHALL be reserved and rejected as a remote node. Invalid explicit or environment-provided nodes SHALL produce a typed usage error before any SSH process starts."}]}
{"claim_id":"federated-search/partial-failure","hash":"7144922a0a7562c4a5234c453f0612930855cd2201a792d9138141642921215f","representations":[{"adapter":"markdown","hash":"545d9de2cd20730afca5117cd38d3317a308b1d2cce77b71192057c8d1594948","role":"normative","scope":"block","text":"A remote connection failure, timeout, nonzero exit, malformed response, or incompatible response SHALL NOT suppress successful local or remote results. Federated search SHALL exit successfully when local search succeeds and SHALL include one deterministic outcome for every selected remote node."}]}
{"claim_id":"federated-search/remote-view","hash":"2df06dede64d0a1624b380eef9104e5911eab0d62651a3866c2e1cf5692eb8ea","representations":[{"adapter":"markdown","hash":"e0fe591d75983e4a846c1cce2501f47ceb47ba9a522ca89542726089d9c9eb5b","role":"normative","scope":"block","text":"`cass view <id> --node <SSH_HOST> --context N` SHALL validate the node with the search node rules, send the identifier and context through structured standard input to the fixed remote CASS command, and return the compatible remote JSON view response. Without `--node`, view SHALL retain existing local behavior."}]}
{"claim_id":"federated-search/response-provenance","hash":"abdcb0b7f19067179576f98133a4bb0dce4a201b7e62cbcf76595f3979430555","representations":[{"adapter":"markdown","hash":"efd4d7474c85c89f4b2a27c270e9d70a9dbcb4f6ee410205524442675021a591","role":"normative","scope":"block","text":"A federated search response SHALL identify its realized mode as `federated`, attach an ordered nonempty `origins` array and a federated rank score to every returned result, and include remote node outcomes. Local-only responses SHALL omit federated-only result and response fields."}]}
{"claim_id":"independence/no-dickles-franken-surface","hash":"d6b767c47d610e6e362cec8b43ffa1b613594071d45941925f92bac850ce8985","representations":[{"adapter":"markdown","hash":"a30a308486976091f150a1ba359e80d439dd70204edfa577ef9016486be13d81","role":"normative","scope":"block","text":"- **WHEN** final manifests, lockfiles, build scripts, source, tests, workflows,\n  and maintained documentation are scanned\n- **THEN** prohibited legacy dependency surfaces and removed provider surfaces\n  are absent"}]}
{"claim_id":"indexing/complete-scan-purges-missing-source","hash":"115f85386aa6e0bc623e4798cc99209e0a41f4e38a7ad65e8986f95437b05558","representations":[{"adapter":"markdown","hash":"bed25d9a5087c99c695a29012de838c53862611263e635b539225aec3464556b","role":"normative","scope":"block","text":"- **WHEN** a complete successful provider scan no longer discovers a previously indexed source\n- **THEN** its conversation, messages, FTS rows, and embeddings are removed"}]}
{"claim_id":"indexing/concurrent-writer-is-rejected","hash":"f598d48ca373c6864c3bc34ee48b9e5c0305d9d87d34d4395795239a7a3217b1","representations":[{"adapter":"markdown","hash":"226db7a26299279bcb302ddb7b0b022e0a4ec7692b08def59647e2b89abb2c0c","role":"normative","scope":"block","text":"- **WHEN** a second `cass index` targets a database with an active index writer\n- **THEN** it returns a typed JSON busy error without starting a competing refresh"}]}
{"claim_id":"indexing/incomplete-scan-preserves-state","hash":"436d042e7f365674f6c6de70b996aa09b119289d6cfd6e57ae11ae7a2bfd0c10","representations":[{"adapter":"markdown","hash":"13327d93bb327fbcf8dbdb26921fad67bc39119b7f4d2edbccc6455ee983c6f5","role":"normative","scope":"block","text":"- **WHEN** provider discovery or parsing fails before a complete scan is established\n- **THEN** previously indexed conversations are not purged as missing"}]}
{"claim_id":"indexing/only-changed-messages-refresh","hash":"a62bd0ed05f18ad9f28557dd436bce3126d05faa812dfff0f808fc86068852e8","representations":[{"adapter":"markdown","hash":"4be8a2afc4faad45c808d65788dd643266353548a53aa21105d746dd0441882a","role":"normative","scope":"block","text":"- **WHEN** a previously indexed source contains added or changed messages\n- **THEN** only those messages require new canonical writes and semantic embeddings"}]}
{"claim_id":"indexing/unchanged-source-is-skipped","hash":"f7cbabf8eb2bd0c590366451a3303f387c53d7c8fcb21b117b1f28c39bf8cf16","representations":[{"adapter":"markdown","hash":"3227f3eaeb6ad2168bc8abe3ae70c3d83565de8b972acffd38d1da27710cbb27","role":"normative","scope":"block","text":"- **WHEN** `cass index` sees a source whose fingerprint is unchanged\n- **THEN** it reports the source unchanged without rewriting its messages or embeddings"}]}
{"claim_id":"ingestion/malformed-records-do-not-panic","hash":"55c92a101a2c36a1588d8de2841f38e86279cbaf239886bae8e2028e23292c62","representations":[{"adapter":"markdown","hash":"da184d5c61c907f9716ca818a4dc420ad728ef2e6f48371f29b7a804cac7d26d","role":"normative","scope":"block","text":"- **WHEN** a supported JSONL file contains a malformed record\n- **THEN** indexing returns a typed JSON error or bounded diagnostic without panicking"}]}
