[package]
name = "coding-agent-search"
version = "0.7.0"
edition = "2024"
description = "Local search for Claude Code and Codex session histories"
license-file = "LICENSE"
repository = "https://github.com/jamesqo/coding_agent_session_search"
default-run = "cass"
autobins = false
autotests = false
autoexamples = false
autobenches = false
build = false

[lib]
path = "app/lib.rs"

[[bin]]
name = "cass"
path = "app/main.rs"
test = false

[[test]]
name = "cli_contract"
path = "app/tests/cli_contract.rs"

[dependencies]
blake3 = "1.8.5"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
fastembed = { version = "6.0.1", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
