name: Deploy CASS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cass-main
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Zunstable-options --jobs-frontend=4
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: cass-v1
  SCCACHE_BASEDIRS: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cass-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install nextest
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest
          fallback: none

      - name: Test semantic build
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo nextest run --locked
          cargo test --locked --doc

      - name: Show compiler cache statistics
        run: sccache --show-stats

      - name: Save Cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cass-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: -Zunstable-options --jobs-frontend=4 -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Restore Cargo cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cass-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install mold
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3
        with:
          mold-version: 2.42.0
          make-default: false

      - name: Build Linux binary
        run: |
          set -euo pipefail
          cargo build --locked --release
          mkdir -p dist/linux-amd64
          cp target/release/cass dist/linux-amd64/cass
          file dist/linux-amd64/cass | tee /dev/stderr | grep -q 'x86-64'
          dist/linux-amd64/cass \
            --db "$RUNNER_TEMP/cass-deploy-smoke.sqlite3" \
            --models-dir "$RUNNER_TEMP/cass-deploy-models" status \
            | grep -q '"ready":false'

      - name: Show compiler cache statistics
        run: sccache --show-stats

      - name: Upload Linux binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cass-linux-amd64
          path: dist/linux-amd64/cass
          if-no-files-found: error
          retention-days: 1

  build-macos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          targets: aarch64-apple-darwin

      - name: Restore Cargo cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cass-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Restore macOS SDK cache
        id: macos-sdk-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/MacOSX26.1.sdk.tar.xz
          key: cass-macos-sdk-26.1-beee7212d265a6d2

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-zigbuild@0.23.0
          fallback: none

      - name: Acquire macOS SDK
        if: steps.macos-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk_archive="$RUNNER_TEMP/MacOSX26.1.sdk.tar.xz"
          curl --fail --location --retry 3 \
            --output "$sdk_archive" \
            https://github.com/joseluisq/macosx-sdks/releases/download/26.1/MacOSX26.1.sdk.tar.xz
          printf '%s  %s\n' \
            beee7212d265a6d2867d0236cc069314b38d5fb3486a6515734e76fa210c784c \
            "$sdk_archive" \
            | sha256sum --check --strict

      - name: Save macOS SDK cache
        if: steps.macos-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/MacOSX26.1.sdk.tar.xz
          key: cass-macos-sdk-26.1-beee7212d265a6d2

      - name: Cross-compile Apple Silicon binary
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/MacOSX26.1.sdk"
          mkdir -p "$sdk_root"
          tar -xJf "$RUNNER_TEMP/MacOSX26.1.sdk.tar.xz" \
            --strip-components=1 \
            -C "$sdk_root"

          SDKROOT="$sdk_root" \
          MACOSX_DEPLOYMENT_TARGET=13.4 \
          CARGO_TARGET_DIR="$PWD/target-macos" \
            cargo zigbuild --locked --release --target aarch64-apple-darwin
          mkdir -p dist/darwin-arm64
          cp target-macos/aarch64-apple-darwin/release/cass dist/darwin-arm64/cass
          file dist/darwin-arm64/cass | tee /dev/stderr | grep -q 'arm64'
          sha256sum dist/darwin-arm64/cass

      - name: Show compiler cache statistics
        run: sccache --show-stats

      - name: Upload Apple Silicon binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cass-darwin-arm64
          path: dist/darwin-arm64/cass
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [test, build-linux, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cass-linux-amd64
          path: dist/linux-amd64

      - name: Download Apple Silicon binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cass-darwin-arm64
          path: dist/darwin-arm64

      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: 100.97.52.20,100.102.58.41,100.90.2.48

      - name: Configure deployment SSH key
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy over Tailscale
        shell: bash
        run: |
          set -euo pipefail

          deploy() {
            local target=$1
            local platform=$2
            local staged=".local/bin/.cass-${GITHUB_SHA}"

            ssh "$target" 'mkdir -p "$HOME/.local/bin"'
            scp "dist/${platform}/cass" "${target}:${staged}"

            ssh "$target" sh -s -- "$staged" "$GITHUB_SHA" <<'REMOTE_SCRIPT'
              set -eu
              staged=$1
              revision=$2
              smoke_db="$HOME/.cache/cass-deploy-${revision}.sqlite3"
              smoke_models="$HOME/.cache/cass-deploy-models-${revision}"
              chmod 0755 "$HOME/$staged"
              "$HOME/$staged" --db "$smoke_db" --models-dir "$smoke_models" status \
                | grep -q '"ready":false'
              mv -f "$HOME/$staged" "$HOME/.local/bin/cass"
          REMOTE_SCRIPT
          }

          deploy james@100.97.52.20 linux-amd64 &
          xenia_pid=$!
          deploy jko@100.102.58.41 darwin-arm64 &
          dev_macbook_pid=$!
          deploy james@100.90.2.48 darwin-arm64 &
          personal_macbook_pid=$!

          failed=0
          for pid in "$xenia_pid" "$dev_macbook_pid" "$personal_macbook_pid"; do
            if ! wait "$pid"; then
              failed=1
            fi
          done
          exit "$failed"
