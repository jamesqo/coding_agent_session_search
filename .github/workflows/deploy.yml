name: Deploy CASS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cass-main
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cass-${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Test semantic build
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked --doc

      - name: Build Linux binary
        run: |
          set -euo pipefail
          cargo build --locked --release
          mkdir -p dist/linux-amd64 dist/darwin-arm64
          cp target/release/cass dist/linux-amd64/cass
          file dist/linux-amd64/cass | tee /dev/stderr | grep -q 'x86-64'
          dist/linux-amd64/cass \
            --db "$RUNNER_TEMP/cass-deploy-smoke.sqlite3" \
            --models-dir "$RUNNER_TEMP/cass-deploy-models" status \
            | grep -q '"ready":false'

      - name: Cross-compile Apple Silicon binary
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/io" \
            --volume "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            --volume "$HOME/.cargo/git:/usr/local/cargo/git" \
            --volume "$HOME/.rustup:/usr/local/rustup" \
            --workdir /io \
            ghcr.io/rust-cross/cargo-zigbuild:0.23.0@sha256:b8364c2c60cdcc9b95c402d17654bff517410926a35678bd89dd924b8158d6ae \
            cargo zigbuild --locked --release --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/cass dist/darwin-arm64/cass
          file dist/darwin-arm64/cass | tee /dev/stderr | grep -q 'arm64'
          sha256sum dist/linux-amd64/cass dist/darwin-arm64/cass

      - name: Save Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cass-${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Join tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: 100.97.52.20,100.102.58.41,100.90.2.48

      - name: Configure deployment SSH key
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy over Tailscale
        shell: bash
        run: |
          set -euo pipefail

          deploy() {
            local target=$1
            local platform=$2
            local staged=".local/bin/.cass-${GITHUB_SHA}"

            ssh "$target" 'mkdir -p "$HOME/.local/bin"'
            scp "dist/${platform}/cass" "${target}:${staged}"

            ssh "$target" sh -s -- "$staged" "$GITHUB_SHA" <<'REMOTE_SCRIPT'
              set -eu
              staged=$1
              revision=$2
              smoke_db="$HOME/.cache/cass-deploy-${revision}.sqlite3"
              smoke_models="$HOME/.cache/cass-deploy-models-${revision}"
              chmod 0755 "$HOME/$staged"
              "$HOME/$staged" --db "$smoke_db" --models-dir "$smoke_models" status \
                | grep -q '"ready":false'
              mv -f "$HOME/$staged" "$HOME/.local/bin/cass"
          REMOTE_SCRIPT
          }

          deploy james@100.97.52.20 linux-amd64
          deploy jko@100.102.58.41 darwin-arm64
          deploy james@100.90.2.48 darwin-arm64
