name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build semantic binary
        run: cargo build --release --locked
      - name: Package
        run: tar -C target/release -czf cass-linux-x86_64.tar.gz cass
      - uses: actions/upload-artifact@v4
        with:
          name: cass-linux-x86_64
          path: cass-linux-x86_64.tar.gz
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cass-linux-x86_64.tar.gz
