schema: vspec

context: |
  Implementation language: Rust.
  Native test framework and runner: cargo nextest 0.9.143.
  Veritas evidence producer: rust-test (discovery); nextest executes tests.
  Configured agent hosts: Codex and Claude Code.
  Veritas access mode: project-bound CLI fallback via vtas until host reload
  exposes the project-scoped MCP server.
  Workflow skill catalog root: /home/james/.local/share/skill-issue/skills.
  Resolve named VSpec workflow skills under that root first. If a skill name
  resolves elsewhere, record its concrete catalog root here before use.
  Product scope: independent CASS supporting exactly Claude Code and Codex
  JSONL histories.
  Test execution uses cargo nextest run for parallelism; cargo test remains
  only for doctests or cases nextest cannot execute.

