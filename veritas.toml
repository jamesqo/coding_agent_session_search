schema = 1

[[claims]]
name = "spec"
adapter = "markdown"
role = "normative"
include = ["openspec/specs/**/*.md", "openspec/changes/*/specs/**/*.md"]
marker = "claim"

[gate]
coverage = true

[coverage]
exclude = []

[artifacts]
claims = ".veritas/claims.lock"
approvals = ".veritas/approvals.lock"
evidence = ".veritas/evidence.lock"
[[evidence]]
name = "rust-tests"
plugin = "rust-test"
root = "."
workspace = true
